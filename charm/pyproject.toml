[project]
name = "catalogue-k8s"
version = "0.0"
requires-python = "~=3.14.0"

dependencies = [
  "ops[tracing]>=3.10.0",
  "lightkube",
  "lightkube-models",
  "jsonschema",
  "cryptography",
  "cosl",
  "pydantic>=2",  # istio-beacon lib requirement,
  "charmed-service-mesh-helpers>=0.2.0", # istio-beacon lib requirement,
  "lightkube-extensions", # istio-beacon lib requirement,
]

[project.optional-dependencies]
dev = [
  # Linting
  "ruff",
  "codespell",
  # Static
  "pyright",
  "responses==0.20.0",
  "httpcore",
  # Unit
  "pytest",
  # ops.testing re-exports Scenario's Context/State only when this is installed
  "ops-scenario>=8",
  "coverage[toml]",
  "deepdiff",
  "fs",
  # Interface
  "pytest-interface-tester",
  # Integration
  "jubilant>=1.8,<2",
  "pytest-jubilant>=2,<3",
  "prometheus-api-client",
  "requests",
  "tenacity",
  "sh",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# Linting tools configuration
[tool.ruff]
line-length = 99
target-version = "py314"
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "PLC0415"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = {"tests/*" = ["D100","D101","D102","D103"]}

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# src and tests at strict; the owned lib is deliberately NOT included here
# (its unannotated types would pollute strict analysis of src) — the static
# tox env checks it separately at standard mode via pyright-lib/.
extraPaths = ["src", "lib"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
include = ["src", "tests"]
# Only the bracketed `# pyright: ignore[rule]` spelling works (AGENTS.md):
# mypy's `# type: ignore` suppresses nothing here, and a suppression that
# goes stale fails the gate.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
addopts = "--tb=native --verbose --capture=no --log-cli-level=INFO"
markers = ["juju_setup", "juju_teardown"]

[tool.codespell]
skip = ".git,.tox,build,venv*"
ignore-words-list = "assertIn"
